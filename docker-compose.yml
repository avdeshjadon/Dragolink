version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dragolink-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dragolink}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dragolink-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: dragolink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dragolink-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dragolink-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dragolink-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dragolink-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dragolink-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dragolink-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/dragolink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - APP_JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - APP_JWT_EXPIRATIONMS=${JWT_EXPIRATION_MS:-86400000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080/}
    networks:
      - dragolink-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dragolink-frontend
    ports:
      - "5173:80"
    networks:
      - dragolink-network

volumes:
  mysql_data:
  redis_data:

networks:
  dragolink-network:
    driver: bridge
