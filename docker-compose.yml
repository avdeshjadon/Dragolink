version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dragolink-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - REDIS_URL=${REDIS_URL}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_SECURITY_PROTOCOL=${SPRING_KAFKA_SECURITY_PROTOCOL}
      - SPRING_KAFKA_SASL_MECHANISM=${SPRING_KAFKA_SASL_MECHANISM}
      - SPRING_KAFKA_SASL_JAAS_CONFIG=${SPRING_KAFKA_SASL_JAAS_CONFIG}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATIONMS=${JWT_EXPIRATION_MS:-86400000}
      - APP_BASE_URL
    networks:
      - dragolink-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dragolink-frontend
    ports:
      - "5173:80"
    networks:
      - dragolink-network

networks:
  dragolink-network:
    driver: bridge
